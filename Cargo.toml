[workspace]
members = ["quinn", "quinn-proto", "quinn-udp"]
default-members = ["quinn", "quinn-proto", "quinn-udp"]
resolver = "2"

[workspace.package]
rust-version = "1.85"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinn-rs/quinn"
keywords = ["quic"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
anyhow = "1.0.22"
arbitrary = { version = "1.0.1", features = ["derive"] }
async-io = "2"
async-std = "1.11"
assert_matches = "1.1"
aws-lc-rs = { version = "1.9", default-features = false }
bencher = "0.1.5"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc = "3"
directories-next = "2"
fastbloom = { version = "0.17", default-features = false }
futures-io = "0.3.19"
getrandom = { version = "0.4", default-features = false }
hdrhistogram = { version = "7.2", default-features = false }
hex-literal = "1"
lru-slab = "0.1.2"
lazy_static = "1"
log = "0.4"
once_cell = "1.19"
pin-project-lite = "0.2"
qlog = "0.15.2"
rand = "0.10.1"
rcgen = "0.14"
ring = "0.17"
rustc-hash = "2"
rustls = { version = "0.23.5", default-features = false, features = ["std"] }
rustls-platform-verifier = "0.7"
rustls-pki-types = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
slab = "0.4.6"
smol = "2"
socket2 = ">=0.5, <0.7"
thiserror = "2.0.3"
tinyvec = { version = "1.1", features = ["alloc"] }
tokio = { version = "1.28.1", features = ["sync"] }
tracing = { version = "0.1.10", default-features = false, features = ["std"] }
tracing-futures = { version = "0.2.0", default-features = false, features = ["std-future"] }
tracing-subscriber = { version = "0.3.0", default-features = false, features = ["env-filter", "fmt", "ansi", "time", "local-time"] }
url = "2"
wasm-bindgen-test = { version = "0.3.45" }
web-time = "1"
windows-sys = { version = ">=0.52, <=0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_Networking_WinSock"] }
cfg_aliases = "0.2"

# quinn-udp 0.6.1 (overlaid from the upstream main lineage onto this 0.11.x
# base) opts into `[lints] workspace = true`, so the 0.11.x workspace root
# must define these. Copied verbatim from upstream main; all `warn`.
[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
unnameable_types = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
manual_let_else = "warn"
or_fun_call = "warn"
use_self = "warn"

[profile.bench]
debug = true

[profile.release]
debug = true
